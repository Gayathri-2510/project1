<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ABC Project</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <section id="html-section">
        <h2>HTML Section</h2>
        <div class="abc-images">
            <img src="images/a.jpg" alt="Letter A">
            <img src="images/b.jpg" alt="Letter B">
            <img src="images/c.jpg" alt="Letter C">
        </div>
    </section>

    <section id="css-section">
        <h2>CSS Section</h2>
        <h3>This is a regular h3</h3>
        <h3 class="blue-text">This h3 should be blue</h3>
        <h3 class="blue-text">Another blue h3</h3>
        <h3 class="blue-text">Third blue h3</h3>
        <h3 id="red-text">This h3 should be red</h3>
    </section>

    <section id="js-section">
        <h2>JavaScript Section</h2>
        <h5>Click me to change color!</h5>
        <h5>Click me too!</h5>
        <h5>Don't forget about me!</h5>
    </section>

    <script src="script.js"></script>
</body>
</html>
